<div class="min-h-screen bg-slate-50 dark:bg-slate-900">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <app-admin-sidebar></app-admin-sidebar>

    <!-- Main Content -->
    <div class="flex-1 p-8">
      <div
        class="bg-white dark:bg-gray-900 rounded-xl shadow p-8 w-full max-w-2xl mx-auto"
      >
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">
          Create Category
        </h1>

        <form (ngSubmit)="createCategory()" #categoryForm="ngForm">
          <!-- Name Field -->
          <div class="mb-6">
            <label
              class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2"
            >
              Name <span class="text-red-500">*</span>
            </label>
            <input
              [(ngModel)]="category.name"
              name="name"
              type="text"
              class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="Enter category name"
              required
              (blur)="generateSlug()"
            />
          </div>

          <!-- Description Field -->
          <div class="mb-6">
            <label
              class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2"
            >
              Description <span class="text-red-500">*</span>
            </label>
            <textarea
              [(ngModel)]="category.description"
              name="description"
              rows="4"
              class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-vertical"
              placeholder="Enter category description"
              required
            ></textarea>
          </div>

          <!-- Image Section -->
          <div class="mb-6">
            <div class="flex items-center justify-between mb-4">
              <label
                class="block text-sm font-semibold text-gray-700 dark:text-gray-300"
              >
                Category Image <span class="text-gray-500">(Optional)</span>
              </label>
              <button
                type="button"
                (click)="toggleImageMethod()"
                class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300"
              >
                {{ useFileUpload ? 'Use URL instead' : 'Upload file instead' }}
              </button>
            </div>

            <!-- File Upload Method -->
            <div *ngIf="useFileUpload" class="space-y-4">
              <div
                class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-6 text-center hover:border-indigo-400 transition-colors"
              >
                <input
                  type="file"
                  (change)="onFileSelected($event)"
                  accept="image/*"
                  class="hidden"
                  #fileInput
                />
                <div
                  *ngIf="!imagePreview"
                  class="cursor-pointer"
                  (click)="fileInput.click()"
                >
                  <svg
                    class="mx-auto h-12 w-12 text-gray-400 dark:text-gray-500"
                    stroke="currentColor"
                    fill="none"
                    viewBox="0 0 48 48"
                  >
                    <path
                      d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                  <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                    <span
                      class="font-medium text-indigo-600 dark:text-indigo-400"
                      >Click to upload</span
                    >
                    or drag and drop
                  </p>
                  <p class="text-xs text-gray-500 dark:text-gray-500">
                    PNG, JPG, GIF up to 10MB
                  </p>
                </div>

                <!-- Image Preview -->
                <div *ngIf="imagePreview" class="relative">
                  <img
                    [src]="imagePreview"
                    alt="Preview"
                    class="mx-auto max-h-40 rounded-lg shadow-md"
                  />
                  <button
                    type="button"
                    (click)="removeImage()"
                    class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 transition"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"
                      ></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- URL Method -->
            <div *ngIf="!useFileUpload">
              <input
                [(ngModel)]="category.imageUrl"
                name="imageUrl"
                type="url"
                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                placeholder="Enter image URL"
              />
              <!-- URL Preview -->
              <div *ngIf="category.imageUrl" class="mt-4">
                <img
                  [src]="category.imageUrl"
                  alt="Preview"
                  class="max-h-40 rounded-lg shadow-md"
                  (error)="category.imageUrl = ''"
                />
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div
            class="flex gap-4 pt-6 border-t border-gray-200 dark:border-gray-700"
          >
            <button
              type="button"
              (click)="cancel()"
              class="flex-1 px-6 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition"
            >
              Cancel
            </button>
            <button
              type="submit"
              [disabled]="!categoryForm.valid"
              class="flex-1 px-6 py-3 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition"
            >
              Create Category
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
